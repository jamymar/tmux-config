
# ==========================================
# TMUX — DL/ML WORKSPACE
# CATPPUCCIN MACCHIATO
# ==========================================

# Terminal et couleurs
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Souris et historique
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on

# Ctrl+B reste le prefixe par defaut

# Numerotation
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==========================================
# NOM DES FENETRES
# ==========================================

# Ne plus renommer automatiquement les fenetres
setw -g automatic-rename off
setw -g allow-rename off

# Garder les noms manuels dans la barre
setw -g window-status-format \
  '#I:#W'
setw -g window-status-current-format \
  '#I:#W'

# ==========================================
# PANNEAUX — RACCOURCIS NATIFS
# ==========================================

# Ctrl+B puis "
bind '"' split-window -v -c "#{pane_current_path}"

# Ctrl+B puis %
bind % split-window -h -c "#{pane_current_path}"

# Nouvelle fenetre dans le dossier courant
bind c new-window -c "#{pane_current_path}"

# Renommer : Ctrl+B puis ,
# Raccourci natif conserve

# Recharger : Ctrl+B puis r
bind r source-file ~/.tmux.conf \; \
  display-message "Config reloaded"

# Presse-papiers
set -s set-clipboard on

# ==========================================
# CATPPUCCIN MACCHIATO
# ==========================================

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'

# Remplacer les icones par du texte
set -g @catppuccin_session_icon 'SESSION'
set -g @catppuccin_directory_icon 'DIR'
set -g @catppuccin_host_icon 'HOST'
set -g @catppuccin_ram_icon 'RAM'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Charger le theme avant les modules de statut
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# ==========================================
# STATUS BAR
# ==========================================

set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-left-length 50
set -g status-right-length 160

# Partie gauche
set -g status-left \
  "#{E:@catppuccin_status_session}"

# Partie droite : RAM, GPU, heure
set -g status-right \
  "#{E:@catppuccin_status_ram}"

# GPU : script du depot, optionnel
# Activer seulement si le script est installe
# et affiche correctement ses caracteres
# set -ag status-right \
#   ' GPU #($HOME/.local/bin/tmux-gpu-status)'

# Heure de Paris
set -ag status-right \
  ' #[fg=#8aadf4]#(TZ=Europe/Paris date +%%H:%%M)'

# ==========================================
# TPM — A LA FIN
# ==========================================

run '~/.tmux/plugins/tpm/tpm'
