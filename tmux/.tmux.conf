
# ==========================================
# TMUX — DL/ML WORKSPACE
# ==========================================

# Terminal et couleurs
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Souris et confort
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g renumber-windows on

# Numérotation à partir de 1
set -g base-index 1
setw -g pane-base-index 1

# Nouveaux panneaux dans le dossier courant
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Recharger la configuration : Ctrl+B puis r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Presse-papiers (selon le terminal)
set -s set-clipboard on

# ==========================================
# TPM + CATPPUCCIN
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'

# Barre inférieure
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 140

# Modules Catppuccin
set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right " #{E:@catppuccin_status_host}"
set -ag status-right " #($HOME/.local/bin/tmux-gpu-status)"
set -ag status-right " #{E:@catppuccin_status_date_time}"

# ==========================================
# INITIALISATION TPM — TOUJOURS À LA FIN
# ==========================================

run '~/.tmux/plugins/tpm/tpm'
